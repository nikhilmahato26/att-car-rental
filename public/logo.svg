<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%" fill="none">
  <!-- Brand Icon Badge -->
  <g transform="translate(5, 5)">
    <!-- Shield / Rounded Hexagon Backdrop -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#2E1065"/>
    <rect x="2" y="2" width="76" height="76" rx="16" fill="#1E1B4B" stroke="#3B82F6" stroke-width="1.5"/>
    
    <!-- Stylized Highway / Road Ribbon in Royal Blue & Subtle Green -->
    <path d="M16 64 L36 22 L44 22 L64 64 Z" fill="#1E40AF" opacity="0.6"/>
    <!-- Curving dynamic road perspective lines -->
    <path d="M22 64 L37 26 L43 26 L58 64 Z" fill="#2563EB"/>
    <!-- Road center dashed marking with subtle green accent -->
    <path d="M40 32 L40 40 M40 46 L40 54 M40 58 L40 64" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Sleek Car Silhouette Emblem in Pure White -->
    <path d="M26 44 C28 39, 34 38, 40 38 C46 38, 52 39, 54 44 L57 48 C58 49, 58 51, 57 52 L56 53 C55 54, 53 54, 52 53 C50 53, 49 54, 48 54 L32 54 C31 54, 30 53, 28 53 C27 54, 25 54, 24 53 L23 52 C22 51, 22 49, 23 48 Z" fill="#FFFFFF"/>
    <!-- Headlights -->
    <circle cx="28" cy="48" r="2" fill="#FACC15"/>
    <circle cx="52" cy="48" r="2" fill="#FACC15"/>
    <!-- Aerodynamic Speed Swoosh -->
    <path d="M12 40 Q 40 18 68 34" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(100, 18)">
    <!-- "ATT" Brand Acronym -->
    <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#1E1B4B">
      ATT
    </text>
    <text x="75" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" letter-spacing="2" fill="#1D4ED8">
      CAR RENTAL
    </text>
    
    <!-- Divider & Dot Accent -->
    <circle cx="258" cy="24" r="3.5" fill="#10B981"/>
    
    <!-- Tagline: Travel Smart, Achieve More -->
    <text x="1" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="3.2" fill="#64748B" text-transform="uppercase">
      TRAVEL SMART, ACHIEVE MORE
    </text>
  </g>
</svg>
